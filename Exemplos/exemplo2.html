<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS interno com classe e id</title>
    <!-- CSS Interno dentro do HEAD! -->
     <style>
        * {
            background-color: aquamarine;
            margin: 0;
            padding: 0;
        }

        #paragrafo{
            font-size: 25;
            background-color: red;
            color: white;
        }
        #informacoes{
            background-color: blueviolet;
            font-size: 30px;
            text-align: center;
        }

        .titulo{
            background-color: rgb(174, 255, 0);
            text-align: right;
            font-weight: bold;
        }

        div a{
            color: red;
        }

        div p{
            color:chartreuse;
        }

     </style>
</head>
<body>
    <p id="paragrafo">CSS aplicado no id</p>
    <p id="informacoes">Informações complementares</p>

    <h3 class="titulo">CSS aplicado na classe</h3>
    <p class="titulo">Informações com classe</p>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="titulo">Allana</td>
                <td>23</td>
            </tr>
        </tbody>
    </table>

    <div>
        <a href="">Primeiro Link</a>
        <p>Qualquer coisa</p>
    </div>
</body>
</html>
